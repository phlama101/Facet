<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0D1117"/>
  <!-- Grid lines -->
  <line x1="60" y1="50" x2="760" y2="50" stroke="#1F2937" stroke-width="1"/>
  <line x1="60" y1="130" x2="760" y2="130" stroke="#1F2937" stroke-width="1"/>
  <line x1="60" y1="210" x2="760" y2="210" stroke="#1F2937" stroke-width="1"/>
  <line x1="60" y1="290" x2="760" y2="290" stroke="#1F2937" stroke-width="1"/>
  <line x1="60" y1="370" x2="760" y2="370" stroke="#1F2937" stroke-width="1"/>
  <!-- Vertical time markers -->
  <line x1="180" y1="40" x2="180" y2="420" stroke="#1F2937" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="40" x2="360" y2="420" stroke="#1F2937" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="540" y1="40" x2="540" y2="420" stroke="#1F2937" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="40" x2="720" y2="420" stroke="#1F2937" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Axes -->
  <line x1="60" y1="420" x2="760" y2="420" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="40" x2="60" y2="420" stroke="#374151" stroke-width="2"/>
  <!-- Baseline -->
  <line x1="60" y1="220" x2="760" y2="220" stroke="#374151" stroke-width="1.5"/>
  <!-- Noise before P-wave -->
  <path d="M 60,220 Q 80,218 100,222 Q 120,218 140,221 Q 155,219 170,220" stroke="#4B5563" stroke-width="1.5" fill="none"/>
  <!-- P-wave arrival at ~180px -->
  <line x1="182" y1="40" x2="182" y2="420" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="186" y="58" font-family="monospace" font-size="11" fill="#60A5FA">P-wave arrival</text>
  <!-- P-wave train (compact oscillation) -->
  <path d="M 182,220 Q 195,200 205,220 Q 215,240 225,220 Q 235,202 245,220 Q 255,238 265,220 Q 275,205 285,220 Q 295,235 305,220 Q 315,208 325,220 Q 335,230 345,220 Q 350,215 355,220" stroke="#60A5FA" stroke-width="2" fill="none"/>
  <!-- S-wave arrival at ~360px -->
  <line x1="362" y1="40" x2="362" y2="420" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="366" y="58" font-family="monospace" font-size="11" fill="#EF4444">S-wave arrival</text>
  <!-- S-wave train (larger amplitude) -->
  <path d="M 362,220 Q 380,165 400,220 Q 420,275 440,220 Q 460,155 480,220 Q 500,285 520,220 Q 532,173 545,220" stroke="#EF4444" stroke-width="2.5" fill="none"/>
  <!-- Surface waves at ~540px (largest amplitude) -->
  <line x1="542" y1="40" x2="542" y2="420" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="546" y="58" font-family="monospace" font-size="11" fill="#A78BFA">Surface waves</text>
  <!-- Surface wave (very long period, large amplitude) -->
  <path d="M 542,220 Q 565,120 590,220 Q 615,320 640,220 Q 665,110 690,220 Q 715,330 740,220 Q 752,165 760,190" stroke="#A78BFA" stroke-width="3" fill="none"/>
  <!-- Amplitude annotation -->
  <line x1="45" y1="120" x2="60" y2="120" stroke="#4ADE80" stroke-width="1.5"/>
  <line x1="45" y1="320" x2="60" y2="320" stroke="#4ADE80" stroke-width="1.5"/>
  <line x1="52" y1="120" x2="52" y2="320" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="5" y="225" font-family="monospace" font-size="10" fill="#4ADE80" transform="rotate(-90,10,225)">Amplitude</text>
  <!-- Time axis label -->
  <text x="400" y="445" font-family="monospace" font-size="11" fill="#6B7280" text-anchor="middle">Time →</text>
  <text x="180" y="435" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">+0 min</text>
  <text x="360" y="435" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">+8 min</text>
  <text x="540" y="435" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">+14 min</text>
  <!-- Y-axis label -->
  <text x="15" y="225" font-family="monospace" font-size="11" fill="#6B7280" transform="rotate(-90,15,225)">Ground motion</text>
  <!-- Title -->
  <text x="400" y="28" font-family="monospace" font-size="14" fill="#7AD7F0" text-anchor="middle" font-weight="bold">SEISMOGRAM — EARTHQUAKE WAVE ARRIVALS</text>
</svg>
