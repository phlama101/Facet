<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0D1117"/>
  <!-- Ocean floor -->
  <rect x="0" y="280" width="800" height="170" fill="#0F2A44"/>
  <!-- Continental plates -->
  <polygon points="0,100 280,100 350,200 350,280 0,280" fill="#374151"/>
  <polygon points="800,120 520,120 450,200 450,280 800,280" fill="#374151"/>
  <!-- Mountain range on left continent -->
  <polygon points="80,100 120,40 160,100" fill="#4B5563"/>
  <polygon points="140,100 185,50 230,100" fill="#4B5563"/>
  <polygon points="200,100 240,60 280,100" fill="#4B5563"/>
  <!-- Subduction trench between plates -->
  <path d="M 350,280 Q 400,380 450,280" stroke="#1E3A5F" stroke-width="3" fill="#0A1628"/>
  <!-- Subducting oceanic plate -->
  <path d="M 450,280 L 400,450 L 350,280" fill="#0F2A44" stroke="#1D4ED8" stroke-width="1.5"/>
  <!-- Magma rising -->
  <path d="M 390,380 Q 370,300 340,220 Q 330,200 320,180" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="8,4" fill="none"/>
  <circle cx="320" cy="175" r="8" fill="#EF4444" opacity="0.8"/>
  <!-- Volcano on overriding plate -->
  <polygon points="265,120 290,70 315,120" fill="#B45309"/>
  <circle cx="290" cy="68" r="6" fill="#EF4444" opacity="0.9"/>
  <!-- Ocean depth labels -->
  <text x="200" y="305" font-family="monospace" font-size="11" fill="#94A3B8">Continental Crust</text>
  <text x="530" y="305" font-family="monospace" font-size="11" fill="#94A3B8">Overriding Plate</text>
  <text x="380" y="340" font-family="monospace" font-size="10" fill="#60A5FA">Trench</text>
  <text x="390" y="415" font-family="monospace" font-size="10" fill="#3B82F6">Subducting Oceanic Plate</text>
  <text x="295" y="58" font-family="monospace" font-size="10" fill="#EF4444">Volcanic Arc</text>
  <!-- Mid-ocean ridge on far right -->
  <polygon points="700,280 730,240 760,280" fill="#1D4ED8" opacity="0.8"/>
  <text x="665" y="265" font-family="monospace" font-size="10" fill="#60A5FA">Mid-ocean Ridge</text>
  <!-- Labels -->
  <text x="400" y="30" font-family="monospace" font-size="14" fill="#7AD7F0" text-anchor="middle" font-weight="bold">SUBDUCTION ZONE — PLATE TECTONICS</text>
  <text x="400" y="50" font-family="monospace" font-size="11" fill="#6B7280" text-anchor="middle">Dense oceanic crust sinks beneath lighter continental crust</text>
  <!-- Mantle wedge label -->
  <text x="380" y="230" font-family="monospace" font-size="10" fill="#D97706">Mantle Wedge</text>
  <rect x="355" y="190" width="90" height="45" fill="#78350F" opacity="0.3" rx="4"/>
</svg>
