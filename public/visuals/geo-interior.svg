<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0D1117"/>
  <!-- Concentric half-circles: inner core, outer core, mantle, crust -->
  <!-- Inner core -->
  <circle cx="400" cy="450" r="90" fill="#7C3AED" opacity="0.9"/>
  <!-- Outer core -->
  <circle cx="400" cy="450" r="170" fill="#1D4ED8" opacity="0.85"/>
  <!-- Lower mantle -->
  <circle cx="400" cy="450" r="270" fill="#B45309" opacity="0.8"/>
  <!-- Upper mantle / lithosphere -->
  <circle cx="400" cy="450" r="340" fill="#78350F" opacity="0.75"/>
  <!-- Crust -->
  <circle cx="400" cy="450" r="370" fill="#374151" opacity="0.9"/>
  <!-- Clip to top half -->
  <rect x="0" y="0" width="800" height="450" fill="#0D1117" opacity="0"/>
  <!-- Clip lower half -->
  <rect x="0" y="450" width="800" height="450" fill="#0D1117"/>

  <!-- Depth labels on right side -->
  <text x="710" y="440" font-family="monospace" font-size="11" fill="#6B7280">0 km</text>
  <text x="710" y="360" font-family="monospace" font-size="11" fill="#6B7280">70 km</text>
  <text x="700" y="235" font-family="monospace" font-size="11" fill="#6B7280">700 km</text>
  <text x="700" y="130" font-family="monospace" font-size="11" fill="#6B7280">2,900 km</text>
  <text x="700" y="50" font-family="monospace" font-size="11" fill="#6B7280">5,100 km</text>

  <!-- Tick marks -->
  <line x1="690" y1="435" x2="770" y2="435" stroke="#374151" stroke-width="1"/>
  <line x1="690" y1="355" x2="770" y2="355" stroke="#374151" stroke-width="1"/>
  <line x1="690" y1="228" x2="770" y2="228" stroke="#374151" stroke-width="1"/>
  <line x1="690" y1="120" x2="770" y2="120" stroke="#374151" stroke-width="1"/>

  <!-- Legend labels -->
  <rect x="30" y="50" width="12" height="12" rx="2" fill="#374151"/>
  <text x="48" y="61" font-family="monospace" font-size="12" fill="#E2E8F0">Crust  (0–70 km)</text>
  <rect x="30" y="80" width="12" height="12" rx="2" fill="#78350F"/>
  <text x="48" y="91" font-family="monospace" font-size="12" fill="#E2E8F0">Mantle (70–2,900 km)</text>
  <rect x="30" y="110" width="12" height="12" rx="2" fill="#1D4ED8"/>
  <text x="48" y="121" font-family="monospace" font-size="12" fill="#E2E8F0">Outer Core  (liquid Fe-Ni)</text>
  <rect x="30" y="140" width="12" height="12" rx="2" fill="#7C3AED"/>
  <text x="48" y="151" font-family="monospace" font-size="12" fill="#E2E8F0">Inner Core  (solid Fe-Ni)</text>

  <!-- Title -->
  <text x="400" y="30" font-family="monospace" font-size="14" fill="#7AD7F0" text-anchor="middle" font-weight="bold">EARTH'S INTERNAL STRUCTURE</text>

  <!-- Annotation feature markers (invisible guides for annotation placement):
    A: crust edge   (x=50% → 400px, y=10% → 45px) → cx=560,cy=87 on half-circle
    B: mantle       (x=25% → 200px, y=35% → 157px)
    C: outer core   (x=50% → 400px, y=48% → 216px)
    D: inner core   (x=50% → 400px, y=62% → 279px — but shown from top as % of SVG)
    E: boundary/moho (x=72% → 576px, y=22% → 99px)
  -->

  <!-- Seismic wave path illustration -->
  <path d="M 120 440 Q 200 200 400 360 Q 550 280 680 440" stroke="#7AD7F0" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="6,4"/>
  <text x="240" y="320" font-family="monospace" font-size="10" fill="#7AD7F0" opacity="0.7" transform="rotate(-25,240,320)">P-wave path</text>
</svg>
