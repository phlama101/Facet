<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#060B14"/>
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="150" cy="80" r="1" fill="white" opacity="0.6"/>
  <circle cx="700" cy="20" r="1.3" fill="white" opacity="0.8"/>
  <circle cx="750" cy="100" r="1" fill="white" opacity="0.5"/>
  <circle cx="600" cy="400" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="100" cy="380" r="1" fill="white" opacity="0.7"/>
  <circle cx="400" cy="50" r="1" fill="white" opacity="0.5"/>
  <!-- Sun -->
  <circle cx="65" cy="225" r="52" fill="#FCD34D"/>
  <circle cx="65" cy="225" r="68" fill="#FCD34D" opacity="0.12"/>
  <text x="65" y="293" font-family="monospace" font-size="11" fill="#FCD34D" text-anchor="middle" font-weight="bold">SUN</text>
  <text x="65" y="307" font-family="monospace" font-size="9" fill="#92400E" text-anchor="middle">99.86% of mass</text>
  <!-- Orbits -->
  <ellipse cx="65" cy="225" rx="145" ry="30" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <ellipse cx="65" cy="225" rx="215" ry="45" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <ellipse cx="65" cy="225" rx="285" ry="60" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <ellipse cx="65" cy="225" rx="365" ry="80" stroke="#6B2800" stroke-width="1" fill="none" stroke-dasharray="3,3" opacity="0.6"/>
  <ellipse cx="65" cy="225" rx="475" ry="110" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <ellipse cx="65" cy="225" rx="590" ry="145" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <ellipse cx="65" cy="225" rx="680" ry="175" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <!-- Mercury -->
  <circle cx="210" cy="225" r="5" fill="#9CA3AF"/>
  <text x="210" y="248" font-family="monospace" font-size="9" fill="#9CA3AF" text-anchor="middle">Mercury</text>
  <!-- Venus -->
  <circle cx="280" cy="225" r="8" fill="#D97706"/>
  <text x="280" y="248" font-family="monospace" font-size="9" fill="#D97706" text-anchor="middle">Venus</text>
  <!-- Earth -->
  <circle cx="350" cy="225" r="8" fill="#2563EB"/>
  <circle cx="350" cy="225" r="5" fill="#16A34A" opacity="0.7"/>
  <text x="350" y="248" font-family="monospace" font-size="9" fill="#60A5FA" text-anchor="middle" font-weight="bold">Earth</text>
  <!-- Mars -->
  <circle cx="430" cy="225" r="6" fill="#DC2626"/>
  <text x="430" y="248" font-family="monospace" font-size="9" fill="#DC2626" text-anchor="middle">Mars</text>
  <!-- Asteroid belt -->
  <text x="440" y="160" font-family="monospace" font-size="9" fill="#78350F">Asteroid Belt</text>
  <circle cx="395" cy="185" r="2" fill="#78350F" opacity="0.8"/>
  <circle cx="420" cy="175" r="2" fill="#78350F" opacity="0.7"/>
  <circle cx="450" cy="180" r="2" fill="#78350F" opacity="0.8"/>
  <circle cx="465" cy="190" r="1.5" fill="#78350F" opacity="0.6"/>
  <!-- Jupiter -->
  <circle cx="540" cy="225" r="22" fill="#D97706"/>
  <line x1="519" y1="218" x2="561" y2="218" stroke="#92400E" stroke-width="3"/>
  <line x1="519" y1="226" x2="561" y2="226" stroke="#B45309" stroke-width="2"/>
  <text x="540" y="258" font-family="monospace" font-size="9" fill="#D97706" text-anchor="middle">Jupiter</text>
  <!-- Saturn -->
  <circle cx="655" cy="225" r="17" fill="#E8A045"/>
  <ellipse cx="655" cy="225" rx="35" ry="8" stroke="#92400E" stroke-width="2.5" fill="none"/>
  <text x="655" y="255" font-family="monospace" font-size="9" fill="#E8A045" text-anchor="middle">Saturn</text>
  <!-- Uranus -->
  <circle cx="735" cy="225" r="11" fill="#67E8F9"/>
  <text x="735" y="248" font-family="monospace" font-size="9" fill="#67E8F9" text-anchor="middle">Uranus</text>
  <!-- Title -->
  <text x="400" y="28" font-family="monospace" font-size="14" fill="#7AD7F0" text-anchor="middle" font-weight="bold">THE SOLAR SYSTEM</text>
  <text x="400" y="44" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">Not to scale — orbits and sizes schematic</text>
</svg>
