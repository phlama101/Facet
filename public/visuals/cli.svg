<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0D1117"/>
  <!-- Space background -->
  <rect x="0" y="0" width="800" height="200" fill="#060B14"/>
  <!-- Earth surface -->
  <rect x="0" y="340" width="800" height="110" fill="#1A3A1A"/>
  <!-- Ocean -->
  <rect x="0" y="380" width="800" height="70" fill="#0F2A44"/>
  <!-- Atmosphere band -->
  <rect x="0" y="200" width="800" height="140" fill="#0F1F3D" opacity="0.7"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1D4ED8" stroke-width="1.5"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="20" y="278" font-family="monospace" font-size="12" fill="#60A5FA">ATMOSPHERE</text>
  <!-- CO2 / greenhouse gas molecules -->
  <circle cx="200" cy="250" r="6" fill="#4ADE80" opacity="0.7"/>
  <circle cx="310" cy="240" r="6" fill="#4ADE80" opacity="0.7"/>
  <circle cx="450" cy="255" r="6" fill="#4ADE80" opacity="0.7"/>
  <circle cx="570" cy="245" r="6" fill="#4ADE80" opacity="0.7"/>
  <circle cx="680" cy="260" r="6" fill="#4ADE80" opacity="0.7"/>
  <text x="140" y="225" font-family="monospace" font-size="10" fill="#4ADE80">CO₂ molecules (greenhouse gases)</text>
  <!-- Sun -->
  <circle cx="90" cy="70" r="45" fill="#FCD34D" opacity="0.9"/>
  <circle cx="90" cy="70" r="55" fill="#FCD34D" opacity="0.15"/>
  <text x="90" y="138" font-family="monospace" font-size="11" fill="#FCD34D" text-anchor="middle">SUN</text>
  <!-- Incoming solar radiation -->
  <line x1="130" y1="90" x2="300" y2="200" stroke="#FCD34D" stroke-width="2.5"/>
  <line x1="145" y1="75" x2="400" y2="195" stroke="#FCD34D" stroke-width="2.5"/>
  <line x1="135" y1="115" x2="220" y2="200" stroke="#FCD34D" stroke-width="2.5"/>
  <text x="250" y="170" font-family="monospace" font-size="10" fill="#FCD34D" transform="rotate(35,250,170)">Incoming solar radiation</text>
  <!-- Reflected solar -->
  <line x1="270" y1="200" x2="140" y2="90" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="155" y="158" font-family="monospace" font-size="9" fill="#E2E8F0">Reflected 30%</text>
  <!-- Surface absorption -->
  <line x1="400" y1="340" x2="400" y2="200" stroke="#EF4444" stroke-width="2.5"/>
  <text x="415" y="300" font-family="monospace" font-size="10" fill="#EF4444">Infrared re-emitted</text>
  <!-- Greenhouse re-emission back to surface -->
  <line x1="420" y1="270" x2="500" y2="340" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="380" y1="270" x2="300" y2="340" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="590" y="310" font-family="monospace" font-size="10" fill="#EF4444">Back-radiation</text>
  <text x="590" y="323" font-family="monospace" font-size="10" fill="#EF4444">(greenhouse effect)</text>
  <!-- Surface labels -->
  <text x="680" y="365" font-family="monospace" font-size="11" fill="#4ADE80">Land surface</text>
  <text x="680" y="410" font-family="monospace" font-size="11" fill="#60A5FA">Ocean</text>
  <!-- Title -->
  <text x="400" y="28" font-family="monospace" font-size="14" fill="#7AD7F0" text-anchor="middle" font-weight="bold">THE GREENHOUSE EFFECT &amp; CLIMATE SYSTEM</text>
</svg>
